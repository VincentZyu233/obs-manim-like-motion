name: Build Manim Motion Plugin

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Trigger Conditions 🔎
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.flags.outputs.should_build }}
      should_release: ${{ steps.flags.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Trigger Flags
        id: flags
        run: |
          MSG="$(git log -1 --format=%B)"
          EVENT="${{ github.event_name }}"
          REF="${{ github.ref }}"

          BUILD=false
          RELEASE=false

          # 1. 手动触发
          if [ "$EVENT" = "workflow_dispatch" ]; then
            BUILD=true
          fi

          # 2. Tag 触发
          if [[ "$REF" == refs/tags/* ]]; then
            BUILD=true
            RELEASE=true
          fi

          # 3. Commit Message 匹配触发词 [build], [build-action], [build-release], [release]
          has_trigger() {
            printf '%s\n' "$MSG" | grep -qiE "(^|[^[:alnum:]_-])\\[$1\\]([^[:alnum:]_-]|$)"
          }

          if has_trigger "build-release" || has_trigger "release"; then
            BUILD=true
            RELEASE=true
          elif has_trigger "build" || has_trigger "build-action" || has_trigger "build-artifact"; then
            BUILD=true
          fi

          echo "should_build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "should_release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "🚀 Trigger Decision: should_build=$BUILD, should_release=$RELEASE"

  windows-build:
    name: Build Windows x64 🪟
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Parse Buildspec
        id: setup
        run: |
          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          "pluginName=$($BuildSpec.name)" >> $env:GITHUB_OUTPUT
          "pluginVersion=$($BuildSpec.version)" >> $env:GITHUB_OUTPUT
          "commitHash=$($env:GITHUB_SHA.Substring(0, 9))" >> $env:GITHUB_OUTPUT

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: RelWithDebInfo

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: RelWithDebInfo

      - name: Upload Windows Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-${{ steps.setup.outputs.commitHash }}
          path: |
            release/*.zip
            build_x64/rundir/RelWithDebInfo/${{ steps.setup.outputs.pluginName }}.dll
            build_x64/rundir/RelWithDebInfo/${{ steps.setup.outputs.pluginName }}.pdb
            build_x64/rundir/RelWithDebInfo/${{ steps.setup.outputs.pluginName }}/**

  ubuntu-build:
    name: Build Ubuntu Linux x64 🐧
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Parse Buildspec
        id: setup
        run: |
          product_name="$(jq -r .name buildspec.json)"
          product_version="$(jq -r .version buildspec.json)"
          echo "pluginName=${product_name}" >> $GITHUB_OUTPUT
          echo "pluginVersion=${product_version}" >> $GITHUB_OUTPUT
          echo "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x86_64
          config: RelWithDebInfo

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x86_64
          config: RelWithDebInfo
          package: true

      - name: Upload Ubuntu Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-ubuntu-x86_64-${{ steps.setup.outputs.commitHash }}
          path: |
            release/*.*
            build_x86_64/rundir/RelWithDebInfo/${{ steps.setup.outputs.pluginName }}.so

  release:
    name: Create GitHub Release 🚀
    needs: [check, windows-build, ubuntu-build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        id: prep
        run: |
          product_name="$(jq -r .name buildspec.json)"
          product_version="$(jq -r .version buildspec.json)"
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            TAG="v${product_version}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${product_name} ${TAG}" >> "$GITHUB_OUTPUT"

          mkdir -p release_dist
          find artifacts -type f \( -name "*.zip" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.tar.xz" \) -exec cp {} release_dist/ \;
          ls -la release_dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.prep.outputs.tag }}"
          TITLE="${{ steps.prep.outputs.title }}"
          shopt -s nullglob
          FILES=(release_dist/*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No package archives found, skipping release upload."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TITLE" \
            --generate-notes \
            "${FILES[@]}" || gh release upload "$TAG" "${FILES[@]}" --clobber

